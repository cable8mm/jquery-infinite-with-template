<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jquery Infinite Scroll With Template</title>
    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrender/1.2.0/jsrender.min.js"></script>

    <!-- Load InfiniteScrollWithTemplate -->
    <script src="../jquery.infiniteScrollWithTemplate.js"></script>
  </head>

  <body>
    <script>
      $(function () {
        $("#result").infiniteTemplate({
          templateSelector: "#test-tmpl",
          dataPath: "./data_sources.json",
          query: "word=ajax",
          zeroCallback: function () {
            alert("zero alert");
          },
        });
      });
    </script>
    <div id="result"></div>
    <div id="more">MORE</div>
    <script id="test-tmpl" type="text/x-jsrender">
      <p>{{:id}}. {{:title}}</p>
    </script>
  </body>
</html>
